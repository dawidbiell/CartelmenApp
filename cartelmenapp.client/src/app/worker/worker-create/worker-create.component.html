<p>worker-create works!</p>

<form (ngSubmit)="onSubmit()" #workerForm="ngForm" class="worker-form">
  <div class="form-group">
    <label for="firstName">First Name:</label>
    <input type="text" id="firstName" required [(ngModel)]="worker.firstName" name="firstName" class="form-control" />
  </div>

  <div class="form-group">
    <label for="lastName">Last Name:</label>
    <input type="text" id="lastName" required [(ngModel)]="worker.lastName" name="lastName" class="form-control" />
  </div>

  <div class="form-group">
    <label for="phone">Phone (Optional):</label>
    <input type="tel" id="phone" [(ngModel)]="worker.phone" name="phone" class="form-control" />
  </div>

  <div class="form-group">
    <label for="email">Email (Optional):</label>
    <input type="email" id="email" [(ngModel)]="worker.email" name="email" class="form-control" />
  </div>

  <div class="form-group">
    <label for="payRate">Pay Rate:</label>
    <input type="number" id="payRate" required [(ngModel)]="worker.payRate" name="payRate" class="form-control" />
  </div>

  <div class="form-group">
    <label for="hiringDate">Hiring Date (Optional):</label>
    <input type="date" id="hiringDate" [(ngModel)]="worker.hiringDate" name="hiringDate" class="form-control" />
  </div>

  <button type="submit" class="btn btn-primary">Submit</button>
</form>
