<div class="hero bg-base-200 min-h-screen ">
  @if (!registreMode()) {
    <div class="hero-content text-center">
      <div class="flex flex-col items-center">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-42 mb-4 text-primary">
          <path fill-rule="evenodd"
            d="M12 2.25c-5.385 0-9.75 4.365-9.75 9.75s4.365 9.75 9.75 9.75 9.75-4.365 9.75-9.75S17.385 2.25 12 2.25ZM12.75 6a.75.75 0 0 0-1.5 0v6c0 .414.336.75.75.75h4.5a.75.75 0 0 0 0-1.5h-3.75V6Z"
            clip-rule="evenodd" />
        </svg>
        <h1 class="text-5xl font-bold">Welcome to Cartelmen!</h1>
        <p class="py-6">Your one-stop shop for all your cartel needs. Explore our wide range of products and services.</p>
        <div class="flex items-center gap-3">
          <button class="btn btn-primary" (click)="SetRegisterMode(true)">Register</button>
          <button class="btn btn-info">Learn More</button>
        </div>
      </div>
    </div>
  } @else {
    <div class="w-full text-2xl text-center flex justify-center">
      <app-register class="w-full"
        (cancelRegister)="SetRegisterMode(!$event)"
      />
    </div>
  }
</div>
