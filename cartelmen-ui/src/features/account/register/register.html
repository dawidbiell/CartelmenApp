<div class="card bg-base-100 w-1/2 mx-auto flex-col p-6 rounded-lg shadow-lg">
  <h5 class="card-title justify-center text-3xl text-primary">Sign Up</h5>
  <div class="card-body">
    <form #registerForm="ngForm" class="flex flex-col gap-4" (ngSubmit)="register()">
        <input type="text" class="input w-full" name="username" [(ngModel)]="creds.username" placeholder="Enter username">
        <input type="email" class="input w-full" name="email" [(ngModel)]="creds.email" placeholder="Enter email">
        <input type="password" class="input w-full" name="password" [(ngModel)]="creds.password" placeholder="Enter password">
      <div class="flex items-center justify-end gap-3 ">
        <button class="btn" >Cancel</button>
        <button type="submit" class="btn btn-primary">Register</button>
      </div>
    </form>
  </div>
</div>
