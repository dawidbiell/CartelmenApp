<app-nav />
<h1>  HEllo</h1>

<div class="card bg-base-100 w-1/2 mx-auto p-10  shadow-xl mt-24">
    <h3 class="text-3xl text-green-500 ">{{title()}}</h3>
    <ul class="list">
      @for (spot of spots(); track spot.id) {
        <li class="list-row items-center">
            <img src="/building.jpg" alt="buildingIco" class="size-12 rounded-box"/>
            {{spot.name}}: {{spot.description}}
        </li>
      }
    </ul>

</div>



<button class="btn btn-primary">Primary</button>
